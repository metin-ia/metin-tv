plugins { id "com.android.application" }

def numero = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "fr.metinia.tv"
    compileSdk 35

    defaultConfig {
        applicationId "fr.metinia.tv"
        minSdk 24
        targetSdk 35
        versionCode numero
        versionName "1.0.${numero}"
    }

    signingConfigs {
        metin {
            def fichier = System.getenv("METIN_TV_KEYSTORE_FICHIER")
            if (fichier) {
                storeFile file(fichier)
                storePassword System.getenv("METIN_TV_KEYSTORE_MDP")
                keyAlias "metin-tv"
                keyPassword System.getenv("METIN_TV_KEYSTORE_MDP")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("METIN_TV_KEYSTORE_FICHIER") ? signingConfigs.metin : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    testImplementation "junit:junit:4.13.2"
}
