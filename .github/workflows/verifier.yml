name: Vérifier Metin TV

# chaque proposition (pull request) : l'application est fabriquée et ses essais passés, sans rien publier
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Fabriquer et essayer
        run: gradle --no-daemon assembleDebug testDebugUnitTest
